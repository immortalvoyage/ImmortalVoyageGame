<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>不朽之旅｜新手村與正式出生</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-mode="onboarding">
  <main class="shell">
    <header>
      <p class="eyebrow">IMMORTAL VOYAGE</p>
      <h1>新手村</h1>
      <p class="subtle">先用教學 Avatar 熟悉生活，再由你主動確認離開。教學物品、金錢、關係與進度都不會帶入正式人生。</p>
    </header>

    <section id="recovery-panel" class="card" hidden>
      <h2>確認上一個動作</h2>
      <p id="recovery-text" class="message">上一個動作的結果尚未確認。</p>
      <button id="recovery-button" type="button">重新確認上一個動作</button>
    </section>

    <article id="status-panel" class="card status-card" role="status" aria-live="polite" aria-atomic="true">
      <h2>訊息</h2>
      <p id="message" class="message">正在進入新手村……</p>
    </article>

    <section id="birth-panel" class="card" hidden>
      <h2>建立教學 Avatar</h2>
      <form id="birth-form">
        <label for="character-name">教學顯示名稱</label>
        <div class="row">
          <input id="character-name" maxlength="24" required autocomplete="off">
          <button type="submit">開始教學</button>
        </div>
      </form>
    </section>

    <section id="game-panel" hidden>
      <nav id="mobile-game-nav" class="workspace-nav" aria-label="遊戲操作">
        <button type="button" data-mobile-tab="scene" aria-pressed="false">情境</button>
        <button type="button" data-mobile-tab="travel" aria-pressed="false">移動</button>
        <button type="button" data-mobile-tab="dialogue" aria-pressed="false">對話</button>
        <button type="button" data-mobile-tab="actions" aria-pressed="false">行動</button>
        <button type="button" data-mobile-tab="trade" aria-pressed="false">交易</button>
        <button type="button" data-mobile-tab="character" aria-pressed="false">角色</button>
      </nav>

      <article class="card workspace-view location-card" data-workspace-view="scene">
        <h2 id="location-name">世界</h2>
        <p id="location-description"></p>
        <p id="narrative-text" class="narrative"></p>
        <div id="narrative-actions" class="actions"></div>
      </article>

      <article id="travel-panel" class="card workspace-view" data-workspace-view="travel" hidden>
        <h2>移動</h2><div id="travel-actions" class="actions"></div>
      </article>
      <article id="dialogue-panel" class="card workspace-view" data-workspace-view="dialogue" hidden>
        <h2>對話</h2><div id="dialogue-actions" class="actions"></div>
      </article>
      <article id="utility-panel" class="card workspace-view" data-workspace-view="actions" hidden>
        <h2>可執行行動</h2><div id="world-actions" class="actions"></div>
      </article>

      <article id="trade-panel" class="card workspace-view" data-workspace-view="trade" hidden>
        <h2>寄售交易</h2>
        <form id="trade-form" class="trade-form">
          <label>物品<select id="trade-item" required></select></label>
          <label>數量<input id="trade-quantity" type="number" min="1" step="1" required inputmode="numeric"></label>
          <label>總價<input id="trade-price" type="number" min="1" step="1" required inputmode="numeric"></label>
          <button id="trade-submit" type="submit">上架寄售</button>
        </form>
        <div id="trade-listings" class="trade-listings"></div>
      </article>

      <article class="card workspace-view character-card" data-workspace-view="character">
        <h2 id="character-heading">教學 Avatar</h2>
        <dl id="character-state" class="stats"></dl>
        <div id="character-pager" class="pager" hidden></div>
      </article>

      <article id="leave-tutorial-panel" class="card workspace-view lifecycle-card" data-workspace-view="character" hidden>
        <h2>離開新手村</h2>
        <p>離開後，教學 Avatar 的物品、金錢、關係與進度會全部丟棄，不能帶入正式人生。</p>
        <button id="leave-tutorial-button" type="button">確認離開新手村</button>
      </article>
    </section>

    <section id="formal-birth-panel" class="card" hidden>
      <h2>正式出生</h2>
      <p>新手村教學資料已與正式世界分離。請選擇這一世的正式姓名與出生地。</p>
      <form id="formal-birth-form">
        <label for="formal-character-name">正式姓名</label>
        <input id="formal-character-name" maxlength="24" required autocomplete="off">

        <label for="birth-location">出生地</label>
        <select id="birth-location" required></select>
        <p id="birth-location-description" class="subtle"></p>
        <button type="submit">正式出生</button>
      </form>
    </section>


  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
