<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>不朽之旅 V2 開發切片</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">IMMORTAL VOYAGE · V2 DEV SLICE</p>
      <h1>不朽之旅</h1>
      <p class="subtle">本頁只驗證新的 deterministic 世界核心與最小生存閉環。</p>
    </header>

    <section id="recovery-panel" class="card" hidden>
      <h2>確認上一個動作</h2>
      <p id="recovery-text" class="message">上一個動作的結果尚未確認。</p>
      <button id="recovery-button" type="button">重新確認上一個動作</button>
    </section>

    <section id="birth-panel" class="card" hidden>
      <h2>出生</h2>
      <form id="birth-form">
        <label for="character-name">姓名</label>
        <div class="row">
          <input id="character-name" maxlength="24" required autocomplete="off">
          <button type="submit">進入世界</button>
        </div>
      </form>
    </section>

    <section id="game-panel" hidden>
      <div class="grid">
        <article class="card">
          <h2 id="location-name">世界</h2>
          <p id="location-description"></p>
          <p id="narrative-text" class="narrative"></p>
          <div id="narrative-actions" class="actions"></div>
        </article>

        <article class="card">
          <h2>角色</h2>
          <dl id="character-state" class="stats"></dl>
        </article>
      </div>

      <article class="card">
        <h2>可執行行動</h2>
        <div id="world-actions" class="actions"></div>
      </article>

      <article id="trade-panel" class="card" hidden>
        <h2>寄售交易</h2>
        <p class="subtle">固定總價、非即時寄售。上架物品會先進入交易保管，成交或取消後再由伺服器結算。</p>
        <form id="trade-form" class="trade-form">
          <label>
            物品
            <select id="trade-item" required></select>
          </label>
          <label>
            數量
            <input id="trade-quantity" type="number" min="1" step="1" required inputmode="numeric">
          </label>
          <label>
            總價
            <input id="trade-price" type="number" min="1" step="1" required inputmode="numeric">
          </label>
          <button id="trade-submit" type="submit">上架寄售</button>
        </form>
        <div id="trade-listings" class="trade-listings"></div>
      </article>
    </section>

    <article class="card">
      <h2>訊息</h2>
      <p id="message" class="message">正在讀取世界狀態……</p>
    </article>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
